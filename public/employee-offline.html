<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#062f33" />
    <title>Quiksol — Sin conexión</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f3ef;
        color: #121817;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid #e7ded6;
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      }
      img { width: 190px; height: auto; }
      h1 { margin: 30px 0 12px; font-size: 32px; }
      p { margin: 0; color: #52605e; line-height: 1.7; }
      .notice {
        margin-top: 24px;
        padding: 16px;
        border: 1px solid #f2cd72;
        border-radius: 12px;
        background: #fff8df;
        color: #6b4d00;
        font-weight: 700;
      }
      button {
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 10px;
        padding: 0 20px;
        background: #d96022;
        color: white;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logos/quicksol-logo.svg" alt="Quiksol" />
      <h1>Estás sin conexión</h1>
      <p>
        Puedes volver al borrador que ya estaba abierto en este dispositivo,
        pero no es posible verificar inventario, apartar productos, confirmar
        pedidos ni generar recibos definitivos.
      </p>
      <div class="notice">
        Sin conexión. La disponibilidad debe verificarse antes de confirmar.
      </div>
      <button type="button" onclick="location.reload()">Reintentar conexión</button>
    </main>
  </body>
</html>
